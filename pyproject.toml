[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ser2tcp"
dynamic = ["version"]
description = "Serial port proxy to TCP or TELNET"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    { name = "Pavel Revak", email = "pavel.revak@gmail.com" }
]
keywords = ["serial", "tcp", "telnet", "proxy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyserial>=3.0",
    "uhttp-server>=3.2",
    "cryptography>=42.0",
]

# What the tests need on top of what ser2tcp itself needs. The
# WebSocket integration tests drive a real client against the running
# process; ser2tcp is the server there, so it has no WebSocket client
# of its own and this belongs here rather than in dependencies.
[project.optional-dependencies]
test = [
    "websocket-client>=1.0",
]

[project.urls]
Homepage = "https://github.com/cortexm/ser2tcp"

[project.scripts]
ser2tcp = "ser2tcp.main:main"
ser2tcp-install = "ser2tcp.install:main"

[tool.setuptools.packages.find]
include = ["ser2tcp*"]

[tool.setuptools.package-data]
ser2tcp = ["html/**"]

[tool.setuptools_scm]
write_to = "ser2tcp/_version.py"
fallback_version = "0.0.0"
