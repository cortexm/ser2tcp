<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ser2tcp terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/css/xterm.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1e1e1e; color: #ccc; font-family: sans-serif;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.toolbar { display: flex; align-items: center; gap: 0.8em;
  padding: 0.4em 0.8em; background: #2d2d2d; border-bottom: 1px solid #444;
  flex-shrink: 0; }
.toolbar .endpoint {
  font-family: monospace; font-size: 0.95em;
  color: #888;
  font-weight: 600;
  transition: color 0.15s;
}
.toolbar .endpoint.endpoint-online  { color: #4c4; }
.toolbar .endpoint.endpoint-offline { color: #7dd3fc; }
.toolbar .endpoint.endpoint-error   { color: #e55; }
.toolbar button { padding: 0.3em 0.8em; border: 1px solid #555;
  border-radius: 4px; cursor: pointer; font-size: 0.85em;
  background: #383838; color: #ccc; }
.toolbar button:hover { background: #444; }
.toolbar .btn-connect { background: #4c4; color: #fff; border-color: #4c4; }
.toolbar .btn-connect:hover { background: #3b3; }
.toolbar .btn-disconnect { background: #e55; color: #fff; border-color: #e55; }
.toolbar .btn-disconnect:hover { background: #d44; }
.toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
.toolbar .btn-connect:disabled:hover { background: #4c4; }
.toolbar .spacer { flex: 1; }
.toolbar .status { font-size: 0.85em; color: #aaa; }
.toolbar a { color: #4a9eff; text-decoration: none; font-size: 0.85em; }
.toolbar a:hover { text-decoration: underline; }

.signal-bar { display: inline-flex; align-items: center; gap: 0.3em;
  flex-shrink: 0; }
.signal-bar.hidden { display: none; }
.signal-badge { display: inline-block; padding: 0.1em 0.4em; border-radius: 3px;
  font-size: 0.75em; font-weight: bold; font-family: monospace; }
.signal-on { background: #4c4; color: #fff; }
.signal-off { background: #444; color: #666; }
.signal-click { cursor: pointer; }
.signal-click:hover { opacity: 0.8; }

#terminal-container { flex: 1; overflow: hidden; }
#terminal-container .xterm { height: 100%; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="endpoint" id="endpoint-name"></span>
  <span class="signal-bar hidden" id="signal-bar"></span>
  <span class="spacer"></span>
  <span class="status" id="status">Disconnected</span>
  <button id="btn-clear">Clear</button>
  <button id="btn-connect" class="btn-connect">Connect</button>
</div>

<div id="terminal-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0/lib/addon-fit.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const pathParts = location.pathname.split('/xterm/');
const endpoint = pathParts[1] || '';
const token = localStorage.getItem('ser2tcp_token');

$('endpoint-name').textContent = '/ws/' + endpoint;
document.title = 'ser2tcp \u2014 ' + endpoint;

let ws = null;
let pingInterval = null;
// Tracks whether THIS view's WS reached OPEN, so a close can be told
// apart from never having connected.
let wsEverOpened = false;
// Everything the page knows, all of it from the WebSocket. It used to
// need a second connection - a filtered NDJSON status stream with its
// own authentication - for the signal bar and the port state, and that
// one retried every 2 s for ever and in silence once a session expired.
let wsState = 'offline';
let serialConnected = null;
let signals = null;
// Which lines this client may set, as the server worked it out. The bar
// used to offer RTS and DTR wherever they were reported, including
// where the server drops the request without a word.
let settable = [];

const term = new Terminal({
  cursorBlink: true,
  scrollback: 10000,
  fontSize: 14,
  theme: {
    background: '#1e1e1e',
    foreground: '#cccccc',
    cursor: '#cccccc',
    selectionBackground: '#264f78',
  },
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open($('terminal-container'));
fitAddon.fit();

term.onData(data => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(new TextEncoder().encode(data));
  }
});

window.addEventListener('resize', () => fitAddon.fit());

function connect() {
  if (ws) return;
  wsEverOpened = false;
  setStatus('connecting');
  const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let url = scheme + '//' + location.host + '/ws/' + endpoint;
  if (token) url += '?token=' + encodeURIComponent(token);
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    wsEverOpened = true;
    setStatus('online');
    // Server keeps the connection alive only while there's traffic;
    // KEEP_ALIVE_TIMEOUT in uhttp is 15 s. Send an empty frame every
    // 10 s so an idle terminal (no typing, no output) doesn't get torn
    // down by the server with "The network connection was lost".
    pingInterval = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send('');
    }, 10000);
  };
  ws.onclose = () => {
    ws = null;
    if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
    // What we were told describes a connection we no longer have;
    // stale badges are worse than none.
    serialConnected = null;
    signals = null;
    settable = [];
    renderSignals();
    setStatus(wsEverOpened ? 'offline' : 'error');
  };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') return applyMessage(ev.data);
    term.write(new Uint8Array(ev.data));
  };
}

// A text frame is one JSON object whose top-level keys are topics; a
// frame may carry several, and unknown ones are ignored.
function applyMessage(text) {
  let msg;
  try { msg = JSON.parse(text); } catch { return; }
  if (msg.port) {
    $('endpoint-name').title = [msg.port.device, msg.port.baudrate]
      .filter(Boolean).join(' @ ');
  }
  if (msg.can) { settable = msg.can.signals || []; renderSignals(); }
  if (msg.serial) {
    const was = serialConnected;
    serialConnected = !!msg.serial.connected;
    // Only a change is news. The opening frame states the device
    // state, and a client attaching can be told the port opened in
    // the same breath - saying it twice reads like it happened twice.
    if (was !== serialConnected) notice(serialConnected
      ? 'Device connected'
      : 'Device disconnected' + (msg.serial.reason
        ? ' (' + msg.serial.reason + ')' : ''));
    // The lines say nothing about a device that is gone; the frame
    // that says it came back brings their state with it.
    if (!serialConnected) { signals = null; renderSignals(); }
    applyPortState();
  }
  if (msg.signals) {
    signals = Object.assign({}, signals, msg.signals);
    renderSignals();
  }
  if (msg.error) {
    notice('Refused: ' + (msg.error.request ? msg.error.request + ': ' : '')
      + msg.error.reason);
  }
}

// Something the server said, not something the device did - dimmed and
// fenced so it cannot be mistaken for output.
function notice(msg) {
  term.write('\r\n\x1b[2m--- ' + msg + ' ---\x1b[0m\r\n');
}

function disconnect() {
  if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
  if (ws) { ws.close(); ws = null; setStatus('offline'); }
}

function setStatus(state) {
  wsState = state;
  updateStatus();
  applyPortState();
}

function updateStatus() {
  const labels = {
    connecting: 'Connecting…',
    online: 'Connected',
    offline: 'Disconnected',
    error: 'Unavailable',
  };
  const status = $('status');
  // A live connection is its own answer; only explain an absence - and
  // "Disconnected" is true but useless when the real answer is that
  // there is nothing on the other end.
  const blocked = wsState === 'online' && serialConnected === false;
  status.textContent = blocked ? 'No device' : (labels[wsState] || wsState);
  status.title = blocked ? 'Device not connected' : '';
  updateConnectButton();
}

function updateConnectButton() {
  const btn = $('btn-connect');
  if (wsState === 'online') {
    btn.textContent = 'Disconnect';
    btn.className = 'btn-disconnect';
    btn.onclick = disconnect;
  } else {
    btn.textContent = 'Connect';
    btn.className = 'btn-connect';
    btn.onclick = connect;
  }
  // Connecting is always worth a try now: a device that is not there
  // is something the server tells us about and keeps retrying, not a
  // reason to refuse the click.
  btn.disabled = false;
  btn.title = '';
}

function applyPortState() {
  // Whether the port itself is healthy, which is not the same question
  // as whether this view is subscribed. Nothing heard means we cannot
  // vouch for it either way.
  const state = wsState !== 'online' ? 'offline'
    : serialConnected === null ? 'offline'
      : serialConnected ? 'online' : 'error';
  const ep = $('endpoint-name');
  ep.classList.remove('endpoint-online', 'endpoint-offline', 'endpoint-error');
  ep.classList.add(
    state === 'online' ? 'endpoint-online'
      : state === 'error' ? 'endpoint-error'
      : 'endpoint-offline');
  updateStatus();
}

function renderSignals() {
  const bar = $('signal-bar');
  const names = signals ? Object.keys(signals) : [];
  // Nothing reported means this endpoint is not set up to report
  // signals; a row of dead badges would say less than no row.
  if (!names.length) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.innerHTML = '';
  names.forEach(name => {
    const on = signals[name];
    // Clickable only where the server said this client may set it, and
    // only while there is a connection to say it on. A badge that
    // promises "click to toggle" and is silently dropped is worse than
    // one that does not.
    const clickable = settable.includes(name)
      && ws && ws.readyState === WebSocket.OPEN;
    const badge = document.createElement('span');
    badge.textContent = name.toUpperCase();
    badge.className = 'signal-badge ' + (on ? 'signal-on' : 'signal-off')
      + (clickable ? ' signal-click' : '');
    badge.title = name.toUpperCase()
      + (clickable ? ': click to toggle' : ': read-only here');
    if (clickable) {
      badge.onclick = () => ws.send(
        JSON.stringify({signals: {[name]: !on}}));
    }
    bar.appendChild(badge);
  });
}

$('btn-clear').onclick = () => term.clear();
updateStatus();
if (endpoint) connect();
</script>
</body>
</html>
