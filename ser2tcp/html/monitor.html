<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ser2tcp monitor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1e1e1e; color: #ccc; font-family: sans-serif;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.toolbar { display: flex; align-items: center; gap: 0.8em;
  padding: 0.4em 0.8em; background: #2d2d2d; border-bottom: 1px solid #444;
  flex-shrink: 0; }
.toolbar .endpoint {
  font-family: monospace; font-size: 0.95em;
  color: #888;  /* default — overridden once setStatus runs */
  font-weight: 600;
  transition: color 0.15s;
}
.toolbar .endpoint.endpoint-online  { color: #4c4; }
.toolbar .endpoint.endpoint-offline { color: #7dd3fc; }
.toolbar .endpoint.endpoint-error   { color: #e55; }
.toolbar button { padding: 0.3em 0.8em; border: 1px solid #555;
  border-radius: 4px; cursor: pointer; font-size: 0.85em;
  background: #383838; color: #ccc; }
.toolbar button:hover { background: #444; }
.toolbar .btn-connect { background: #4c4; color: #fff; border-color: #4c4; }
.toolbar .btn-connect:hover { background: #3b3; }
.toolbar .btn-disconnect { background: #e55; color: #fff; border-color: #e55; }
.toolbar .btn-disconnect:hover { background: #d44; }
.toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
.toolbar .btn-connect:disabled:hover { background: #4c4; }
.toolbar .spacer { flex: 1; }
.toolbar .status { font-size: 0.85em; color: #aaa; }
.toolbar a { color: #4a9eff; text-decoration: none; font-size: 0.85em; }
.toolbar a:hover { text-decoration: underline; }
.toolbar label { font-size: 0.85em; display: flex; align-items: center; gap: 0.3em; }

.signal-bar { display: inline-flex; align-items: center; gap: 0.3em;
  flex-shrink: 0; }
.signal-bar.hidden { display: none; }
.signal-badge { display: inline-block; padding: 0.1em 0.4em; border-radius: 3px;
  font-size: 0.75em; font-weight: bold; font-family: monospace; }
.signal-on { background: #4c4; color: #fff; }
.signal-off { background: #444; color: #666; }

.peer-bar { display: inline-flex; align-items: center; gap: 0.3em;
  flex-shrink: 0; }
.peer-bar.hidden { display: none; }
.peer-badge { display: inline-block; padding: 0.1em 0.4em; border-radius: 3px;
  font-size: 0.75em; font-family: monospace; background: #383838;
  border-left: 3px solid currentColor; }

#output { flex: 1; overflow-y: auto; padding: 0.5em; font-family: monospace;
  font-size: 14px; line-height: 1.4; white-space: pre-wrap;
  word-break: break-all; background: #1e1e1e; }
.info { color: #888; font-style: italic; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="endpoint" id="endpoint-name"></span>
  <span class="signal-bar hidden" id="signal-bar"></span>
  <span class="peer-bar hidden" id="peer-bar"></span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="show-source"> Source</label>
  <label><input type="checkbox" id="auto-scroll" checked> Auto-scroll</label>
  <span class="status" id="status">Disconnected</span>
  <button id="btn-clear">Clear</button>
  <button id="btn-connect" class="btn-connect">Connect</button>
</div>

<div id="output"></div>

<script>
const $ = id => document.getElementById(id);
const pathParts = location.pathname.split('/monitor/');
const portName = pathParts[1] || '';
const token = localStorage.getItem('ser2tcp_token');

$('endpoint-name').textContent = portName + ' (monitor)';
document.title = 'ser2tcp monitor — ' + portName;

// The device writes under slot 0; clients get 1-254, and 255 means the
// server had no slot left to give out.
const DEVICE = 0;
const OVERFLOW = 255;
// One colour per slot, cycled. The device keeps its own so it never
// looks like just another writer.
const DEVICE_COLOR = '#0cc';
const PEER_COLORS = [
  '#f90', '#9f6', '#f6c', '#6cf', '#fc6', '#c9f', '#6fc', '#f66',
];

function sourceColor(slot) {
  if (slot === DEVICE) return DEVICE_COLOR;
  if (slot === OVERFLOW) return '#888';
  return PEER_COLORS[(slot - 1) % PEER_COLORS.length];
}

let ws = null;
let pingInterval = null;
// Who wrote the run currently being appended, so a change of writer
// starts a new line. null = nothing written yet.
let lastSource = null;
// Whether the output already ends on a line break, so a change of
// writer right after one does not leave a blank line behind.
let atLineStart = true;
// Tracks whether the current WS attempt actually reached the OPEN state.
// On close we use this to distinguish "device unavailable / proxy refused"
// (red dot) from "was connected, link dropped" (gray dot).
let wsEverOpened = false;
// Everything the monitor has been told over its own WebSocket. It used
// to need a second connection - a filtered NDJSON status stream, with
// its own authentication and its own 2 s retry loop - for the signal
// bar and the port state. Both now arrive here.
let wsState = 'offline';
let serialConnected = null;
let signals = null;
let peers = [];

function connect() {
  if (ws) return;
  wsEverOpened = false;
  setStatus('connecting');
  const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let url = scheme + '//' + location.host + '/ws/monitor/' + portName;
  if (token) url += '?token=' + encodeURIComponent(token);
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    wsEverOpened = true;
    setStatus('online'); appendInfo('Connected'); lastSource = null;
    // Server's KEEP_ALIVE_TIMEOUT is 15 s — ping more often than that or
    // an idle connection gets torn down with "network connection lost".
    pingInterval = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send('');
    }, 10000);
  };
  ws.onclose = ev => {
    ws = null;
    if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
    // What we were told describes a server we can no longer reach;
    // stale badges are worse than none.
    serialConnected = null;
    signals = null;
    peers = [];
    renderSignals();
    renderPeers();
    if (wsEverOpened) {
      setStatus('offline');
      appendInfo('Disconnected (code: ' + ev.code + ')');
    } else {
      setStatus('error');
      appendInfo('Cannot open connection (device unavailable?)');
    }
  };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') return applyMessage(ev.data);
    const arr = new Uint8Array(ev.data);
    if (arr.length < 2) return;
    appendData(arr.slice(1), arr[0]);
  };
}

// A text frame is one JSON object whose top-level keys are topics; a
// frame may carry several, and unknown ones are ignored.
function applyMessage(text) {
  let msg;
  try { msg = JSON.parse(text); } catch { return; }
  if (msg.serial) {
    const was = serialConnected;
    serialConnected = !!msg.serial.connected;
    // Only a change is news; the opening frame states the device
    // state, and repeating it reads like it happened twice.
    if (was !== serialConnected) appendInfo(
      serialConnected ? 'Device connected' : 'Device disconnected');
    // The lines say nothing about a device that is gone; the frame
    // that says it came back brings their state with it.
    if (!serialConnected) { signals = null; renderSignals(); }
    applyPortState();
  }
  if (msg.signals) {
    signals = Object.assign({}, signals, msg.signals);
    renderSignals();
  }
  if (msg.peer_connected) appendInfo(describePeer(msg.peer_connected) + ' joined');
  if (msg.peer_disconnected) appendInfo(describePeer(msg.peer_disconnected) + ' left');
  if (msg.peers) { peers = msg.peers; renderPeers(); }
}

function describePeer(peer) {
  const where = peer.port !== undefined
    ? peer.address + ':' + peer.port : peer.address;
  return (peer.protocol || '?') + ' ' + (where || '?');
}

function disconnect() {
  if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
  if (ws) { ws.close(); ws = null; setStatus('offline'); }
}

// Status states match the main app's port card colors:
//   online  — proxy connected & data flowing  (green)
//   offline — proxy idle / cleanly disconnected (gray)
//   error   — couldn't connect at all          (red)
function setStatus(state) {
  wsState = state;
  updateStatus();
  applyPortState();
}

function updateStatus() {
  const labels = {
    connecting: 'Connecting…',
    online: 'Connected',
    offline: 'Disconnected',
    error: 'Unavailable',
  };
  const status = $('status');
  // A live connection is its own answer; only explain an absence.
  const blocked = wsState === 'online' && serialConnected === false;
  status.textContent = blocked ? 'No device' : (labels[wsState] || wsState);
  status.title = blocked ? 'Device not connected' : '';
  updateConnectButton();
}

function updateConnectButton() {
  const btn = $('btn-connect');
  if (wsState === 'online') {
    btn.textContent = 'Disconnect';
    btn.className = 'btn-disconnect';
    btn.onclick = disconnect;
    btn.disabled = false;
    return;
  }
  btn.textContent = 'Connect';
  btn.className = 'btn-connect';
  btn.onclick = connect;
  // A monitor holds nothing open, so it is always worth a try - the
  // device being away is exactly what it would tell us.
  btn.disabled = false;
}

function applyPortState() {
  // Whether the port itself is healthy, which is not the same question
  // as whether this view is subscribed. Nothing heard yet means we
  // cannot vouch for it either way.
  const state = wsState !== 'online' ? 'offline'
    : serialConnected === null ? 'offline'
      : serialConnected ? 'online' : 'error';
  const ep = $('endpoint-name');
  ep.classList.remove('endpoint-online', 'endpoint-offline', 'endpoint-error');
  ep.classList.add(
    state === 'online' ? 'endpoint-online'
      : state === 'error' ? 'endpoint-error'
      : 'endpoint-offline');
  ep.title = 'Port state: ' + state;
  updateStatus();
}

function renderSignals() {
  const bar = $('signal-bar');
  const names = signals ? Object.keys(signals) : [];
  // No signals reported at all means this port is not set up to report
  // them; a row of dead badges would say less than no row.
  if (!names.length) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.innerHTML = '';
  names.forEach(name => {
    const badge = document.createElement('span');
    badge.textContent = name.toUpperCase();
    badge.className = 'signal-badge ' + (signals[name] ? 'signal-on' : 'signal-off');
    bar.appendChild(badge);
  });
}

function renderPeers() {
  const bar = $('peer-bar');
  if (!peers.length) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.innerHTML = '';
  peers.forEach(peer => {
    const badge = document.createElement('span');
    badge.className = 'peer-badge';
    // Same colour its bytes are drawn in, which is the whole point of
    // the slot: a reader can match the two without being told.
    badge.style.color = sourceColor(peer.slot);
    badge.textContent = peer.slot;
    badge.title = describePeer(peer);
    bar.appendChild(badge);
  });
}

function sourceLabel(slot) {
  if (slot === DEVICE) return '[dev]';
  const peer = peers.find(p => p.slot === slot);
  return '[' + (peer ? peer.protocol + ' ' + slot : slot) + '] ';
}

function appendData(data, slot) {
  const out = $('output');
  const color = sourceColor(slot);
  const newRun = lastSource !== slot;
  if (newRun && !atLineStart) {
    out.appendChild(document.createElement('br'));
    atLineStart = true;
  }
  let text = newRun && $('show-source').checked ? sourceLabel(slot) : '';
  lastSource = slot;
  const flush = breakAfter => {
    if (text) {
      const span = document.createElement('span');
      span.style.color = color;
      span.textContent = text;
      out.appendChild(span);
      text = '';
      atLineStart = false;
    }
    if (breakAfter) {
      out.appendChild(document.createElement('br'));
      atLineStart = true;
    }
  };
  for (let i = 0; i < data.length; i++) {
    const b = data[i];
    if (b >= 0x20 && b < 0x7f) {
      text += String.fromCharCode(b);
      continue;
    }
    // Every byte is still shown as itself - this is a monitor, and a
    // hidden byte is the one you were looking for. A line ending gets
    // a break after it as well, so text traffic reads as text instead
    // of one unbroken run.
    text += '\\x' + b.toString(16).padStart(2, '0').toUpperCase();
    if (b === 0x0a) {
      flush(true);
      // Only when something follows, or the run ends on a stray prefix.
      if (i + 1 < data.length && $('show-source').checked) {
        text = sourceLabel(slot);
      }
    }
  }
  flush(false);
  if ($('auto-scroll').checked) {
    out.scrollTop = out.scrollHeight;
  }
}

function appendInfo(msg) {
  const out = $('output');
  const span = document.createElement('span');
  span.className = 'info';
  span.textContent = '--- ' + msg + ' ---\n';
  out.appendChild(span);
  lastSource = null;
  atLineStart = true;     // the text above ends on one
  if ($('auto-scroll').checked) {
    out.scrollTop = out.scrollHeight;
  }
}

$('btn-clear').onclick = () => {
  $('output').innerHTML = '';
  lastSource = null;
  atLineStart = true;
};
updateStatus();
if (portName) connect();
</script>
</body>
</html>
