<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ser2tcp monitor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1e1e1e; color: #ccc; font-family: sans-serif;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.toolbar { display: flex; align-items: center; gap: 0.8em;
  padding: 0.4em 0.8em; background: #2d2d2d; border-bottom: 1px solid #444;
  flex-shrink: 0; }
.toolbar .endpoint {
  font-family: monospace; font-size: 0.95em;
  color: #888;  /* default — overridden once setStatus runs */
  font-weight: 600;
  transition: color 0.15s;
}
/* What the name's colour means, and it is the port it describes, not
   this page's subscription:
     green  — open, data moving
     blue   — the device is there, nobody has opened it
     red    — the configured device is missing
     grey   — no WebSocket, so we cannot vouch for any of the above */
.toolbar .endpoint.endpoint-online  { color: #4c4; }
.toolbar .endpoint.endpoint-offline { color: #7dd3fc; }
.toolbar .endpoint.endpoint-error   { color: #e55; }
.toolbar .endpoint.endpoint-down    { color: #777; }
.toolbar button { padding: 0.3em 0.8em; border: 1px solid #555;
  border-radius: 4px; cursor: pointer; font-size: 0.85em;
  background: #383838; color: #ccc; }
.toolbar button:hover { background: #444; }
.toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
/* A toggle reads as on or off at a glance; a checkbox needs its tick
   found first, and the label beside it read to learn what the tick
   means. */
.toolbar .toggle-btn.on {
  background: #2b4b6f; color: #cfe6ff; border-color: #3d6c9e;
}
.toolbar .toggle-btn.on:hover { background: #35597f; }
/* One width for both labels, or the button jumps as it toggles and
   the ones beside it shuffle along with it. */
.toolbar .btn-pause { min-width: 5.5em; }
.toolbar .btn-pause.paused {
  background: #b8860b; color: #fff; border-color: #b8860b;
}
.toolbar .btn-pause.paused:hover { background: #a0760a; }
/* The only button here that destroys anything. */
.toolbar .btn-clear { color: #e88; border-color: #744; }
.toolbar .btn-clear:hover { background: #e55; color: #fff; border-color: #e55; }
.toolbar .spacer { flex: 1; }
.toolbar .status { font-size: 0.85em; color: #aaa; }
.toolbar a { color: #4a9eff; text-decoration: none; font-size: 0.85em; }
.toolbar a:hover { text-decoration: underline; }
.toolbar label { font-size: 0.85em; display: flex; align-items: center; gap: 0.3em; }

.signal-bar { display: inline-flex; align-items: center; gap: 0.3em;
  flex-shrink: 0; }
.signal-bar.hidden { display: none; }
.signal-badge { display: inline-block; padding: 0.1em 0.4em; border-radius: 3px;
  font-size: 0.75em; font-weight: bold; font-family: monospace; }
.signal-on { background: #4c4; color: #fff; }
.signal-off { background: #444; color: #666; }

.peer-bar { display: inline-flex; align-items: center; gap: 0.3em;
  flex-shrink: 0; }
.peer-bar.hidden { display: none; }
.peer-badge { display: inline-block; padding: 0.1em 0.4em; border-radius: 3px;
  font-size: 0.75em; font-family: monospace; background: #383838;
  border-left: 3px solid currentColor; }

#output { flex: 1; overflow-y: auto; padding: 0.5em; font-family: monospace;
  font-size: 14px; line-height: 1.4; white-space: pre-wrap;
  word-break: break-all; background: #1e1e1e; }
.info { color: #888; font-style: italic; }
/* Dim, because it is not traffic. The output is monospace and the
   stamp is a fixed 12 characters, so the lines column up on their own. */
.stamp { color: #666; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="endpoint" id="endpoint-name"></span>
  <span class="signal-bar hidden" id="signal-bar"></span>
  <span class="peer-bar hidden" id="peer-bar"></span>
  <span class="spacer"></span>
  <button type="button" id="btn-time" class="toggle-btn on"
    aria-pressed="true">Time</button>
  <button type="button" id="btn-source" class="toggle-btn"
    aria-pressed="false">Source</button>
  <button type="button" id="btn-scroll" class="toggle-btn on"
    aria-pressed="true">Auto-scroll</button>
  <button type="button" id="btn-pause" class="btn-pause">Pause</button>
  <button type="button" id="btn-copy">Copy</button>
  <button type="button" id="btn-save">Save</button>
  <button type="button" id="btn-clear" class="btn-clear">Clear</button>
</div>

<div id="output"></div>

<script>
const $ = id => document.getElementById(id);
const pathParts = location.pathname.split('/monitor/');
const portName = pathParts[1] || '';
const token = localStorage.getItem('ser2tcp_token');

$('endpoint-name').textContent = portName + ' (monitor)';
document.title = 'ser2tcp monitor — ' + portName;

// The device writes under slot 0; clients get 1-254, and 255 means the
// server had no slot left to give out.
const DEVICE = 0;
const OVERFLOW = 255;
// One colour per slot, cycled. The device keeps its own so it never
// looks like just another writer.
const DEVICE_COLOR = '#0cc';
const PEER_COLORS = [
  '#f90', '#9f6', '#f6c', '#6cf', '#fc6', '#c9f', '#6fc', '#f66',
];

function sourceColor(slot) {
  if (slot === DEVICE) return DEVICE_COLOR;
  if (slot === OVERFLOW) return '#888';
  return PEER_COLORS[(slot - 1) % PEER_COLORS.length];
}

let ws = null;
// Who wrote the run currently being appended, so a change of writer
// starts a new line. null = nothing written yet.
let lastSource = null;
// Whether the output already ends on a line break, so a change of
// writer right after one does not leave a blank line behind.
let atLineStart = true;
// The day the last stamp was written on. A stamp says the time and
// nothing else, so the date has to be announced when it turns over -
// otherwise a log left running overnight reads as one long day.
let lastDate = null;
// Tracks whether the current WS attempt actually reached the OPEN state.
// On close we use this to distinguish "device unavailable / proxy refused"
// (red dot) from "was connected, link dropped" (gray dot).
let wsEverOpened = false;
// Everything the monitor has been told over its own WebSocket. It used
// to need a second connection - a filtered NDJSON status stream, with
// its own authentication and its own 2 s retry loop - for the signal
// bar and the port state. Both now arrive here.
let wsState = 'offline';
let serialConnected = null;
let portState = null;
let signals = null;
let peers = [];
// Paused freezes the view, not the connection: a monitor is for
// reading what went past, and what goes past while you read it is
// gone either way. The count is so the gap is admitted rather than
// left as a seam nobody can see.
let paused = false;
let missed = 0;

function connect() {
  if (ws) return;
  wsEverOpened = false;
  setStatus('connecting');
  const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let url = scheme + '//' + location.host + '/ws/monitor/' + portName;
  if (token) url += '?token=' + encodeURIComponent(token);
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    wsEverOpened = true;
    setStatus('online'); appendInfo('Connected'); lastSource = null;
  };
  ws.onclose = ev => {
    ws = null;
    // What we were told describes a server we can no longer reach;
    // stale badges are worse than none.
    serialConnected = null;
    portState = null;
    signals = null;
    peers = [];
    renderSignals();
    renderPeers();
    if (wsEverOpened) {
      setStatus('offline');
      appendInfo('Disconnected (code: ' + ev.code + ')');
    } else {
      setStatus('error');
      // Not the device: a monitor connects to a configured port
      // whether or not anything is on the other end of it.
      appendInfo('Cannot open connection (no such port?)');
    }
  };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') return applyMessage(ev.data);
    const arr = new Uint8Array(ev.data);
    if (arr.length < 2) return;
    appendData(arr.slice(1), arr[0]);
  };
}

// A text frame is one JSON object whose top-level keys are topics; a
// frame may carry several, and unknown ones are ignored.
function applyMessage(text) {
  let msg;
  try { msg = JSON.parse(text); } catch { return; }
  if (msg.port) {
    // Always complete, so it replaces rather than merges.
    const was = portState;
    portState = msg.port.state || null;
    // Whether the device exists on the system at all, which is not the
    // same question as whether the port is open - one is the cable,
    // the other is whether anybody is using it.
    if (was !== null && portState !== null) {
      const there = portState !== 'error';
      if (there !== (was !== 'error')) {
        appendInfo(there ? 'Device plugged in' : 'Device unplugged');
      }
    }
    applyPortState();
  }
  if (msg.serial) {
    const was = serialConnected;
    serialConnected = !!msg.serial.connected;
    // Only a change is news; the opening frame states the device
    // state, and repeating it reads like it happened twice.
    if (was !== serialConnected) appendInfo(serialConnected
      ? 'Device connected'
      // The reason separates "the last client let go of it" from
      // "it was pulled out", which is the whole difference.
      : 'Device disconnected' + (msg.serial.reason
        ? ' (' + msg.serial.reason + ')' : ''));
    // The lines say nothing about a device that is gone; the frame
    // that says it came back brings their state with it.
    if (!serialConnected) { signals = null; renderSignals(); }
    applyPortState();
  }
  if (msg.signals) {
    signals = Object.assign({}, signals, msg.signals);
    renderSignals();
  }
  if (msg.peer_connected) appendInfo(describePeer(msg.peer_connected) + ' joined');
  if (msg.peer_disconnected) appendInfo(describePeer(msg.peer_disconnected) + ' left');
  if (msg.peers) { peers = msg.peers; renderPeers(); }
}

function describePeer(peer) {
  const where = peer.port !== undefined
    ? peer.address + ':' + peer.port : peer.address;
  return (peer.protocol || '?') + ' ' + (where || '?');
}

// A monitor has nothing to hang up: it holds no port open and costs
// the device nothing, so there is no state in which being connected is
// the wrong thing. A page in a background tab can still lose the link
// - the laptop slept, the network went, the server restarted - and
// coming back into view is the moment to find out and pick it up.
function reconnectIfWanted() {
  if (!ws && portName) connect();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) reconnectIfWanted();
});
window.addEventListener('online', reconnectIfWanted);

function setStatus(state) {
  wsState = state;
  applyPortState();
}

// The name is the whole status display. There is no separate text
// beside the buttons any more: it said "Connected" about a connection
// the colour already reports, and "No device" about a port the colour
// already reports, next to the peer badges that say who is on the
// line. Three ways of saying one thing is two too many.
const PORT_STATE_TITLES = {
  online: 'Port open, data moving',
  offline: 'Device present, nobody has opened it',
  error: 'Configured device is missing',
  down: 'No connection to the server',
};

function applyPortState() {
  // The port, not this page's subscription - except that without a
  // WebSocket we cannot vouch for the port at all, and grey says so.
  const state = wsState !== 'online' ? 'down' : (portState || 'offline');
  const ep = $('endpoint-name');
  ep.classList.remove('endpoint-online', 'endpoint-offline',
    'endpoint-error', 'endpoint-down');
  ep.classList.add('endpoint-' + state);
  ep.title = PORT_STATE_TITLES[state] || state;
}

function setPaused(value) {
  paused = value;
  const btn = $('btn-pause');
  btn.textContent = paused ? 'Resume' : 'Pause';
  btn.classList.toggle('paused', paused);
  if (paused) {
    // In the log, because the log is what gets copied and saved: a
    // gap nobody wrote down looks like a quiet line.
    appendInfo('Paused');
    return;
  }
  appendInfo(missed
    ? 'Resumed — ' + missed + ' bytes arrived while paused'
    : 'Resumed');
  missed = 0;
}

function setToggle(id, on) {
  const btn = $(id);
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', String(on));
  return on;
}

function toggleOn(id) {
  return $(id).classList.contains('on');
}

function renderSignals() {
  const bar = $('signal-bar');
  const names = signals ? Object.keys(signals) : [];
  // No signals reported at all means this port is not set up to report
  // them; a row of dead badges would say less than no row.
  if (!names.length) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.innerHTML = '';
  names.forEach(name => {
    const badge = document.createElement('span');
    badge.textContent = name.toUpperCase();
    badge.className = 'signal-badge ' + (signals[name] ? 'signal-on' : 'signal-off');
    bar.appendChild(badge);
  });
}

function renderPeers() {
  const bar = $('peer-bar');
  if (!peers.length) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.innerHTML = '';
  peers.forEach(peer => {
    const badge = document.createElement('span');
    badge.className = 'peer-badge';
    // Same colour its bytes are drawn in, which is the whole point of
    // the slot: a reader can match the two without being told.
    badge.style.color = sourceColor(peer.slot);
    badge.textContent = peer.slot;
    badge.title = describePeer(peer);
    bar.appendChild(badge);
  });
}

function sourceLabel(slot) {
  if (slot === DEVICE) return '[dev] ';
  const peer = peers.find(p => p.slot === slot);
  return '[' + (peer ? peer.protocol + ' ' + slot : slot) + '] ';
}

function pad(value, width) {
  return String(value).padStart(width, '0');
}

// When the line is being written, not when the byte was sent: a run
// carries many bytes and they arrive together. Good enough to line
// traffic up against a log somewhere else, which is what it is for.
function now() {
  const d = new Date();
  return {
    date: d.getFullYear() + '-' + pad(d.getMonth() + 1, 2)
      + '-' + pad(d.getDate(), 2),
    time: pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':'
      + pad(d.getSeconds(), 2) + '.' + pad(d.getMilliseconds(), 3),
  };
}

// Open a line: the date when the day turned over, then the stamp.
// Called once something is certain to be written on the line, so an
// empty run never leaves a stamp with nothing after it.
function beginLine(out) {
  if (!toggleOn('btn-time')) return;
  const at = now();
  if (at.date !== lastDate) {
    lastDate = at.date;
    const day = document.createElement('span');
    day.className = 'info';
    day.textContent = '--- ' + at.date + ' ---\n';
    out.appendChild(day);
  }
  const stamp = document.createElement('span');
  stamp.className = 'stamp';
  stamp.textContent = at.time + ' ';
  out.appendChild(stamp);
}

function appendData(data, slot) {
  if (paused) { missed += data.length; return; }
  const out = $('output');
  const color = sourceColor(slot);
  if (lastSource !== slot && !atLineStart) {
    out.appendChild(document.createElement('br'));
    atLineStart = true;
  }
  lastSource = slot;
  let text = '';
  let opening = atLineStart;
  const open = () => {
    if (!opening) return;
    opening = false;
    beginLine(out);
    if (toggleOn('btn-source')) text += sourceLabel(slot);
  };
  const flush = breakAfter => {
    if (text) {
      const span = document.createElement('span');
      span.style.color = color;
      span.textContent = text;
      out.appendChild(span);
      text = '';
      atLineStart = false;
    }
    if (breakAfter) {
      out.appendChild(document.createElement('br'));
      atLineStart = true;
      opening = true;
    }
  };
  for (let i = 0; i < data.length; i++) {
    const b = data[i];
    open();
    if (b >= 0x20 && b < 0x7f) {
      text += String.fromCharCode(b);
      continue;
    }
    // Every byte is still shown as itself - this is a monitor, and a
    // hidden byte is the one you were looking for. A line ending gets
    // a break after it as well, so text traffic reads as text instead
    // of one unbroken run.
    text += '\\x' + b.toString(16).padStart(2, '0').toUpperCase();
    if (b === 0x0a) flush(true);
  }
  flush(false);
  if (toggleOn('btn-scroll')) {
    out.scrollTop = out.scrollHeight;
  }
}

function appendInfo(msg) {
  const out = $('output');
  // Its own line: glued to the end of a half-written run it would read
  // as something the device said.
  if (!atLineStart) out.appendChild(document.createElement('br'));
  beginLine(out);
  const span = document.createElement('span');
  span.className = 'info';
  span.textContent = '--- ' + msg + ' ---\n';
  out.appendChild(span);
  lastSource = null;
  atLineStart = true;     // the text above ends on one
  if (toggleOn('btn-scroll')) {
    out.scrollTop = out.scrollHeight;
  }
}

// What is on screen, as text. textContent cannot be used: the line
// breaks between runs are <br> elements and it drops them, so every
// line would come out joined to the next.
function bufferText() {
  return Array.from($('output').childNodes)
    .map(node => node.nodeName === 'BR' ? '\n' : node.textContent)
    .join('');
}

// navigator.clipboard exists only in a secure context, and this page
// is usually reached over plain HTTP on a LAN - so the execCommand
// path is not politeness to old browsers, it is the one that runs.
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text)
      .then(() => true, () => execCopy(text));
  }
  return Promise.resolve(execCopy(text));
}

function execCopy(text) {
  const ta = document.createElement('textarea');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  ta.setAttribute('aria-hidden', 'true');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) {
    ok = false;
  }
  ta.remove();
  return ok;
}

// Says what happened on the button itself, briefly. An alert for a
// copy that worked is worse than no news at all.
function flashLabel(id, text) {
  const btn = $(id);
  const was = btn.textContent;
  btn.textContent = text;
  setTimeout(() => { btn.textContent = was; }, 1200);
}

$('btn-copy').onclick = () => {
  copyText(bufferText()).then(ok => flashLabel(
    'btn-copy', ok ? 'Copied' : 'Failed'));
};

$('btn-save').onclick = () => {
  const at = now();
  const name = 'ser2tcp-' + (portName || 'monitor') + '-'
    + at.date.replace(/-/g, '')
    + at.time.slice(0, 8).replace(/:/g, '') + '.log';
  const url = URL.createObjectURL(
    new Blob([bufferText()], { type: 'text/plain' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
};

$('btn-clear').onclick = () => {
  $('output').innerHTML = '';
  lastSource = null;
  atLineStart = true;
  lastDate = null;        // the date line went with the rest
};
$('btn-time').onclick = () => {
  // Turning it back on announces the date again: the last one said is
  // scrolled away somewhere above, if it was ever said at all.
  if (setToggle('btn-time', !toggleOn('btn-time'))) lastDate = null;
};
$('btn-source').onclick = () => setToggle('btn-source', !toggleOn('btn-source'));
$('btn-scroll').onclick = () => setToggle('btn-scroll', !toggleOn('btn-scroll'));
$('btn-pause').onclick = () => setPaused(!paused);
applyPortState();
if (portName) connect();
</script>
</body>
</html>
